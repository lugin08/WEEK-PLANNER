<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week | Discipline</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">DISCIPLINE</div>

        <nav>
            <a href="product.html">TODAY</a>
            <a href="week.html" class="active">WEEK</a>
            <a href="progress.html">PROGRESS</a>
        </nav>

        <button id="theme-toggle">☀️</button>

    </header>


    <main>

        <!-- Week introduction -->

        <section class="week-intro">

            <p class="date" id="week-date">
                THIS WEEK
            </p>

            <h1>
                PLAN YOUR
                <span>WEEK.</span>
            </h1>

            <p class="subtitle">
                STAY CONSISTENT. STAY DISCIPLINED.
            </p>

        </section>


        <!-- Current week -->

        <section class="week-section">

            <div class="week-header">

                <div>
                    <h2>YOUR WEEK</h2>

                    <p id="week-range">
                        SEPTEMBER 7 — SEPTEMBER 13
                    </p>
                </div>

                <span id="week-progress">
                    0%
                </span>

            </div>

<section class="goals-section">

    <div class="goals-header">

        <div>
            <p>THIS WEEK</p>
            <h2>WEEKLY GOALS</h2>
        </div>

        <span id="goals-progress">0%</span>

    </div>

    <div class="goals-progress-bar">
        <div id="goals-progress-fill"></div>
    </div>

    <div id="goals-list"></div>

    <button id="add-goal">
        + ADD GOAL
    </button>

</section>
            <div class="days">

                <div class="day-card" data-day="monday">

                    <div class="day-header">

                        <div>
                            <p>MON</p>
                            <h3>MONDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>


                <div class="day-card" data-day="tuesday">

                    <div class="day-header">

                        <div>
                            <p>TUE</p>
                            <h3>TUESDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>


                <div class="day-card" data-day="wednesday">

                    <div class="day-header">

                        <div>
                            <p>WED</p>
                            <h3>WEDNESDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>


                <div class="day-card" data-day="thursday">

                    <div class="day-header">

                        <div>
                            <p>THU</p>
                            <h3>THURSDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>


                <div class="day-card" data-day="friday">

                    <div class="day-header">

                        <div>
                            <p>FRI</p>
                            <h3>FRIDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>


                <div class="day-card" data-day="saturday">

                    <div class="day-header">

                        <div>
                            <p>SAT</p><h3>SATURDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>


                <div class="day-card" data-day="sunday">

                    <div class="day-header">

                        <div>
                            <p>SUN</p>
                            <h3>SUNDAY</h3>
                        </div>

                        <span class="today-label"></span>

                        <button class="add-day-task">+</button>

                    </div>

                    <div class="day-tasks"></div>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>BUILT BY DISCIPLINE</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
